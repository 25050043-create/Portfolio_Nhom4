    <div class="content">
        <div id="dangky" class="container">
            <div class="section">
                <h2>Đăng Ký</h2>
                <p>Vui lòng điền thông tin vào mẫu đăng ký dưới đây để tham gia sự kiện.</p>
                <form action="#" method="post" class="contact-form">
                    <label for="name">Tên đầy đủ:</label>
                    <input type="text" id="name" name="name" required>
    
                    <label for="email">Địa chỉ email:</label>
                    <input type="email" id="email" name="email" required>
    
                    <label for="phone">Số điện thoại:</label>
                    <input type="tel" id="phone" name="phone">
    
                    <label for="ticket">Loại vé:</label>
                    <select id="ticket" name="ticket">
                        <option value="attendee">Tham dự</option>
                        <option value="volunteer">Tình nguyện viên</option>
                        <option value="vip">VIP</option>
                    </select>
    
                    <label for="special-requests">Yêu cầu đặc biệt:</label>
                    <textarea id="special-requests" name="special-requests"></textarea>
    
                    <button type="submit">Gửi Đăng Ký</button>
                </form>
            </div>
        </div>
    </div>
